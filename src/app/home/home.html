<nav class="flex justify-center gap-3">
  <a class="vault-btn" routerLink="/form">Form</a>
  <a class="vault-btn" routerLink="/game-list">Game list</a>
</nav>

<section class="mx-auto flex max-w-5xl flex-col gap-4 p-4">
  <div class="flex flex-wrap items-center gap-3">
    <label class="text-slate-200" for="search">Search</label>
    <input
      #search
      id="search"
      class="min-w-0 flex-1 rounded-sm border border-slate-700 bg-slate-900 px-3 py-2 text-slate-100 placeholder:text-slate-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400"
      type="search"
      placeholder="Search our Database"
      (keydown.enter)="onSearch(search.value)"
    />
    <button class="vault-btn" type="button" (click)="onSearch(search.value)">Search</button>
  </div>

  @let items = results();
  @if (items === null) {
    <app-state-message text="Searching…" />
  } @else if (items.length === 0 && searchTerm()) {
    <app-state-message text="No games found" />
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (entry of items; track entry.rawgId) {
        <app-game-card
          [game]="entry"
          [savedId]="savedIds().get(entry.rawgId) ?? null"
          (add)="onAdd($event)"
          (remove)="onRemove($event)"
        />
      }
    </div>
  }
</section>
