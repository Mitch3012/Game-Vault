<section class="mx-auto flex max-w-5xl flex-col gap-4 p-4">
  @if (actionError()) {
    <app-error-banner [message]="actionError()" (dismiss)="onDismissError()" />
  }

  <app-ai-toggle [enabled]="aiEnabled()" (toggle)="onToggleAi($event)" />

  @if (aiEnabled()) {
    <app-suggestions
      [title]="suggestionsHeading()"
      [games]="suggestions()"
      [failed]="suggestionsFailed()"
      [vaultEmpty]="suggestionsVaultEmpty()"
      [savedIds]="savedIds()"
      (add)="onAdd($event)"
      (remove)="onRemove($event)"
      (refresh)="onRefreshSuggestions()"
    />
  }

  <h2 id="vault-heading" class="text-xl font-bold tracking-widest break-words text-slate-100 uppercase">{{ vaultHeading() }}</h2>

  <app-transfer-panel
    [canExport]="canExport()"
    [canImport]="canImport()"
    [busy]="transferBusy()"
    [preview]="transferPreview()"
    [message]="transferMessage()"
    (exportVault)="onExport()"
    (fileChosen)="onFileChosen($event)"
    (confirmImport)="onConfirmImport()"
    (cancelImport)="onCancelImport()"
  />

  @let items = games();
  @if (items === null) {
    <app-state-message text="Loading your vault…" />
  } @else if (items.length === 0) {
    <app-state-message text="Your vault is empty. Search for a game on the home page to add one." />
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (game of items; track game.id) {
        <app-game-card [game]="game" [savedId]="game.id" (remove)="onRemove($event)" />
      }
    </div>
  }
</section>
