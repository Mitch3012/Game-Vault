<button
  class="cursor-pointer rounded-full border border-slate-600 px-3 py-1 text-sm text-slate-200 transition hover:border-lime-400 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400 disabled:cursor-not-allowed disabled:opacity-50"
  type="button"
  [disabled]="disabled()"
  (click)="pick.emit(label())"
>
  {{ label() }}
</button>
